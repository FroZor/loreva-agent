name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source
        run: |
          go mod verify
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          build_binary() {
            local os="$1"
            local arch="$2"
            local extension="$3"
            local name="loreva-agent-${os}-${arch}${extension}"

            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -buildvcs=true -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/${name}" ./cmd/loreva-agent
          }

          build_binary linux amd64 ""
          build_binary linux arm64 ""
          build_binary darwin amd64 ""
          build_binary darwin arm64 ""
          build_binary windows amd64 .exe
          build_binary windows arm64 .exe

          (cd dist && sha256sum loreva-agent-* | LC_ALL=C sort -k2 > checksums.txt)

      - name: Store release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish binaries
    needs:
      - build
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist

      - name: Attest release binaries
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/loreva-agent-*
            dist/checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --latest
          --generate-notes
          --title "${GITHUB_REF_NAME}"

  container:
    name: Release container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/frozor/loreva-agent
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
