services:
  loreva-agent:
    image: ghcr.io/frozor/loreva-agent:latest
    pull_policy: always
    restart: unless-stopped
    user: "0:0"
    # The agent reports on the host, not on its container: it shares the
    # host's process, hostname and network namespaces and reads the host root
    # read-only. The Docker socket below already grants root-equivalent access.
    # NET_ADMIN lets it read the firewall rules and SYS_CHROOT lets it run the
    # host's nft and iptables against the host root, as the native service does.
    pid: host
    uts: host
    network_mode: host
    environment:
      HOST_ROOT: /host
      HOST_ETC: /host/etc
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_RUN: /host/run
      HOST_DEV: /host/dev
      HOST_VAR: /host/var
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_CHROOT
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: loreva-agent-state
        target: /var/lib/loreva-agent
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      # Host secrets the agent never reads stay hidden behind empty mounts.
      - type: tmpfs
        target: /host/root
      - type: tmpfs
        target: /host/home
      - type: bind
        source: /dev/null
        target: /host/etc/shadow
        read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loreva-agent-state:
    name: loreva-agent-state
