services:
  loreva-agent:
    image: ghcr.io/frozor/loreva-agent:latest
    pull_policy: always
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: loreva-agent-state
        target: /var/lib/loreva-agent
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loreva-agent-state:
    name: loreva-agent-state
