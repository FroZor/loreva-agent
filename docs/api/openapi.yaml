openapi: 3.1.0
info:
  title: Loreva Agent direct API
  version: "1"
  summary: HTTP API that a node agent serves to paired devices inside its WireGuard tunnel.
  description: |
    The agent serves this API on `http://[<node tunnel address>]:80`. The address is
    reachable only through the node's userspace WireGuard listener; the agent opens no
    TCP port on the host. See [docs/protocol.md](../protocol.md) for the invite format,
    the WireGuard configuration a client must use, and the pairing key agreement.

    **Transport security.** Plain HTTP is intentional: WireGuard authenticates the node
    by its static key, authenticates each peer by its key and PSK, and encrypts every
    packet. There is no TLS layer, no bearer token, and no cookie.

    **Authorization.** The caller is identified by its tunnel source address. WireGuard
    accepts an inner packet only when its source address is the single `/128` allowed for
    the peer that sent it, so the address is as strong as the peer's keys.
    There are two kinds of callers:

    - an *invite peer* (the temporary peer from a `loreva1:` connection key) may call only
      the `pairing` operations;
    - a *paired device* may call every other operation. In this version every paired device
      has full access; there are no roles yet.

    Any other combination returns `403 forbidden`.

    **Requests.** Request bodies are JSON, at most 64 KiB, and are decoded strictly:
    unknown fields, duplicate keys (including keys that differ only by letter case), and
    trailing data are rejected with `400 invalid_json`. Clients should send
    `Content-Type: application/json`.

    **Responses.** Every response body is JSON with `Cache-Control: no-store`. Every non-2xx
    response uses the `Error` schema with a stable `code`. Unknown paths and unsupported
    methods return `404 not_found`. Clients must ignore unknown response fields.

    **Limits.** Request headers are limited to 16 KiB and must arrive within 10 seconds.
    `GET /v1/pairing/{pairing_id}` holds the request for up to 25 seconds while the
    pairing is pending.
  license:
    name: See repository
servers:
  - url: "http://[{node_tunnel_address}]:80"
    description: The node's address inside the WireGuard tunnel, taken from the invite.
    variables:
      node_tunnel_address:
        default: "fd00::1"
        description: "`node_address` from the invite, also `node_address` in saved credentials."
tags:
  - name: pairing
    description: Called by the temporary invite peer to become a paired device.
  - name: node
    description: Information about the node. Paired devices only.
  - name: devices
    description: Paired device management. Paired devices only.
paths:
  /v1/pairing:
    post:
      tags: [pairing]
      operationId: startPairing
      summary: Start pairing with a one-time invite.
      description: |
        The device commits to its new WireGuard public key, its name, and a fresh ML-KEM-768
        encapsulation key. The node consumes the invite, allocates the device's permanent
        tunnel address, encapsulates a shared secret, and shows the 8-character code to the
        operator. The device computes the same code from the response and shows it to the user.

        Each invite starts at most one pairing. A second call returns `409 invite_used`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequest"
      responses:
        "201":
          description: Pairing started and waits for the operator's decision on the node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`invite_used`: the invite has already started a pairing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/pairing/{pairing_id}:
    get:
      tags: [pairing]
      operationId: getPairingStatus
      summary: Wait for the operator's decision.
      description: |
        Long poll. While the status is `pending`, the node holds the request for up to
        25 seconds and returns as soon as the status changes. Call again while the result
        is `pending`. After `approved`, the device switches to its own key, PSK and address;
        the node removes the invite peer about 30 seconds after the decision.
      parameters:
        - name: pairing_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/node:
    get:
      tags: [node]
      operationId: getNode
      summary: Describe the node and the agent.
      responses:
        "200":
          description: Node information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/node/specifications:
    get:
      tags: [node]
      operationId: getSpecifications
      summary: Collect a hardware snapshot.
      description: |
        Collected on request; it can take several seconds. One collection runs at a time;
        concurrent requests wait for it. The body uses the same schema as
        the `node.specifications.report` portal message.
      responses:
        "200":
          description: Hardware snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specifications"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/node/network:
    get:
      tags: [node]
      operationId: getNetwork
      summary: Collect a network and firewall snapshot.
      description: |
        Collected on request. The body uses the same schema as the `node.network.report`
        portal message. Reading the firewall is read-only; the agent never changes it.
      responses:
        "200":
          description: Network snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List paired devices.
      responses:
        "200":
          description: Every paired device. Preshared keys are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/devices/{device_id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a paired device.
      description: |
        The device loses API access immediately and its WireGuard peer is removed about one
        second later. A device may revoke itself; the response still reaches it.
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    BadRequest:
      description: |
        `invalid_json`, `invalid_device_name`, `invalid_public_key`, or `invalid_mlkem_key`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden`: this peer may not call this operation."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: "`body_too_large`: the request body exceeds 64 KiB."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: |
        `unavailable`: the node is shutting down, or another request is already collecting the
        same snapshot and did not finish within 45 seconds. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: "`internal`: the node could not complete the request; details are in the agent log."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              examples: [forbidden]
            message:
              type: string
              description: Short English description for logs. Do not parse it.
    PairingRequest:
      type: object
      required: [device_name, wireguard_public_key, mlkem_encapsulation_key]
      additionalProperties: false
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            1 to 64 printable Unicode characters (valid UTF-8, no control characters).
            Shown to the operator on the node.
        wireguard_public_key:
          type: string
          description: |
            The device's new Curve25519 public key for this node, standard Base64 (44 chars).
            Must differ from the invite key and from every paired device's key.
        mlkem_encapsulation_key:
          type: string
          description: A fresh ML-KEM-768 encapsulation key (1184 bytes), standard Base64.
    PairingStarted:
      type: object
      required: [pairing_id, node_nonce, mlkem_ciphertext, device_address]
      properties:
        pairing_id:
          type: string
          format: uuid
        node_nonce:
          type: string
          description: 32 random bytes, standard Base64.
        mlkem_ciphertext:
          type: string
          description: ML-KEM-768 ciphertext (1088 bytes), standard Base64.
        device_address:
          type: string
          description: The device's permanent IPv6 address inside the tunnel.
          examples: ["fdc4:2323:a719:0:570b:c731:f058:b9e9"]
    PairingStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        device_id:
          type: string
          format: uuid
          description: Present when `status` is `approved`.
    Node:
      type: object
      required:
        [node_id, agent_version, hostname, os, architecture, wireguard_public_key,
         tunnel_address, listen_port, portal_enrolled, time]
      properties:
        node_id:
          type: string
          format: uuid
        agent_version:
          type: string
          examples: [v0.2.0]
        hostname:
          type: string
        os:
          type: string
          description: Go `GOOS` value.
          examples: [linux]
        architecture:
          type: string
          description: Go `GOARCH` value.
          examples: [amd64]
        wireguard_public_key:
          type: string
          description: The node's WireGuard public key, standard Base64.
        tunnel_address:
          type: string
          description: The node's IPv6 address inside the tunnel.
        listen_port:
          type: integer
          description: The node's WireGuard UDP port.
        portal_enrolled:
          type: boolean
          description: Whether the node is also enrolled with a portal.
        time:
          type: string
          format: date-time
          description: The node's clock, UTC.
    Specifications:
      type: object
      required: [observed_at, observation_scope, specifications]
      properties:
        observed_at:
          type: string
          format: date-time
        observation_scope:
          type: string
          description: Where the agent observed the data, for example `host` or `container`.
        specifications:
          type: object
          description: |
            `NodeSpecifications` from `internal/protocol/node_specifications.go`: `system`,
            `cpu`, `memory`, `gpus`, `storage_devices`, `network_interfaces`, and optional
            `collection_issues`.
    Network:
      type: object
      required: [observed_at, observation_scope, network]
      properties:
        observed_at:
          type: string
          format: date-time
        observation_scope:
          type: string
        network:
          type: object
          description: |
            `NodeNetwork` from `internal/protocol/node_network.go`: `interfaces`, `routes`,
            `listening_ports`, `firewall`, and optional `collection_issues`.
    Device:
      type: object
      required: [id, name, wireguard_public_key, tunnel_address, paired_at, current]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        wireguard_public_key:
          type: string
        tunnel_address:
          type: string
        paired_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the device that made the request.
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
